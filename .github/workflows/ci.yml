name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Sintaxis, shellcheck, version y smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sintaxis bash
        run: |
          for f in install.sh hooks.d/backup/90-backup-uki hooks.d/restore/90-restore-uki tests/smoke.sh tests/boot-partition.sh; do
            bash -n "$f" && echo "ok: $f"
          done

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh hooks.d/backup/90-backup-uki \
                                      hooks.d/restore/90-restore-uki tests/smoke.sh \
                                      tests/boot-partition.sh

      # tests/boot-partition.sh levanta un namespace de usuario + chroot para
      # simular el dual-boot. Ubuntu 24.04+ trae AppArmor con
      # apparmor_restrict_unprivileged_userns=1, que puede bloquearlo.
      - name: Namespaces de usuario
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          unshare -r -m -p -f --mount-proc true \
            || { echo "::error::no se pueden crear namespaces de usuario"; exit 1; }
          echo "namespaces OK"

      # La version se declaraba a mano en varios ficheros y ya habia derivado
      # (el titulo del README se quedo en v3.2 mientras el codigo iba en v3.4).
      # VERSION es la unica fuente de verdad.
      - name: Coherencia de version
        run: |
          set -euo pipefail
          v="$(cat VERSION)"
          echo "VERSION=$v"
          grep -q "Backup Script (v${v})"  hooks.d/backup/90-backup-uki
          grep -q "Restore Script (v${v})" hooks.d/restore/90-restore-uki
          grep -q "Instalador v${v}"        install.sh
          grep -q "^# Timeshift UKI Hooks v${v}$" README.md
          grep -q "^## \[${v}\]"            CHANGELOG.md
          echo "Coherente en VERSION, ambos hooks, install.sh, README y CHANGELOG"

      # smoke.sh cubre el backup hook sobre un arbol temporal y delega en
      # boot-partition.sh para la resolucion de la particion de arranque.
      - name: Smoke test
        run: ./tests/smoke.sh