# Timeshift UKI Hooks - Configuración de usuario
# Copia este fichero a /etc/timeshift/uki-hooks.conf y ajusta los valores.
# Se carga en ambos hooks (backup y restore) antes de ejecutar.
# Las variables de entorno TSUKI_* tienen prioridad sobre este fichero.

# --- PURGE OPCIONES ---
# Elimina del respaldo los UKIs que no corresponden al kernel en ejecución.
# Con kernel-install, cada snapshot viaja solo con el UKI vigente.
PRUNE_OLD_UKIS=true

# Elimina de la partición de arranque (ESP/XBOOTLDR) los UKIs versionados
# cuyo kernel ya no está instalado. kernel-install nunca los borra, así que
# sin esto la ESP acumula UKIs muertos (entradas extra en systemd-boot).
PRUNE_ESP_UKIS=true

# Restaura sincroniza la ESP con el snapshot: elimina de la partición de
# arranque los UKIs que no están en el snapshot restaurado.
PRUNE_UKIS=true

# Margen libre (MB) que se quiere dejar en la ESP tras restaurar.
# El umbral real es ESP_MIN_FREE_MB + tamaño de los UKIs a escribir.
ESP_MIN_FREE_MB=20
